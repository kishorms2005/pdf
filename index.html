
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .pdf-container {
            height: 80vh;
            min-height: 400px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 12px #0002;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <header>
        <h2>My PDF Viewer</h2>
        <p>PDF document is loaded automatically</p>
    </header>

    <main class="container">

        <div class="toolbar">
            <h3>My Document</h3>

            <button onclick="downloadPDF()">
                Download PDF
            </button>
        </div>

        <div class="pdf-container">
            <iframe
                id="pdfViewer"
                src="BCS701_Lab Manual.pdf#toolbar=1&navpanes=0"
                title="PDF Viewer">
            </iframe>
        </div>

    </main>

    <script>
        function downloadPDF() {
            const link = document.createElement("a");
            link.href = "myfile.pdf";
            link.download = "myfile.pdf";
            link.click();
        }
    </script>

</body>
</html>
